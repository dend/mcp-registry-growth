name: MCP Registry Data Collection

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  collect-data:
    name: 'Collect MCP Registry Data'
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: data-collection
      cancel-in-progress: false
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
          
      - name: Collect MCP server data
        shell: pwsh
        run: |
          Write-Host "🚀 Starting MCP data collection..."
          .\scripts\Collect-MCPData.ps1 -OutputPath 'data/analytics.csv' -Verbose
          
      # Signed commit through the API, merged through a PR (required by the branch rulesets).
      - name: Commit data updates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git add data/analytics.csv
          bash .github/scripts/commit-signed.sh \
            "bot/data-${{ github.run_id }}-${{ github.run_attempt }}" \
            "chore: update MCP registry data - $(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
            main